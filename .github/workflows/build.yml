name: build

on:
  push:
    branches: main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.workflow_run.conclusion=${{ github.event.workflow_run.conclusion }}"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          python3 -m pip install uv
          uv sync --verbose --active --group build --no-install-project --no-cache --refresh

      - name: Build package artifacts and install wheel
        run: |
          make all
          python3 -m pip install dist/isaric*.whl

      - name: Test wheel import
        run: |
          python3 -c "import arc; print(arc.__version__)"
