name: Run tests marked as critical or high

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Tests (critical/high)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install UV and all dev. dependencies
        run: |
          python --version
          python -m pip install uv
          uv sync --verbose --all-groups --no-install-project

      - name: Run unit tests (critical or high)
        run: |
          uv run pytest -q -m "critical or high"
