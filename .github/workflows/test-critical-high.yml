name: Run tests marked as critical or high

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Tests (critical/high)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install UV and all dev. dependencies
        run: |
          python --version
          python -m pip install uv
          uv sync --verbose --active --all-groups --no-install-project

      - name: Run unit tests (critical or high)
        run: |
          PYTHONPATH="src" uv run --verbose pytest -q -m "critical or high"
