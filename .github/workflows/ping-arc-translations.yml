name: Notify ARC-Translations repo

on:
  push:
      branches:
       - main
  workflow_dispatch:

jobs:
  dispatch:
    if: github.repository == 'aidanmarler/ARC'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ARC-Translations update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.ARCTRANSLATIONS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aidanmarler/ARC-Translations/dispatches \
            -d '{"event_type": "arc-updated"}'
