[project]
  name = "isaric-arc"
  dynamic = [
    "version",
  ]
  description = "ARC (Acute and Rapid onset disease Case report form) - standardised clinical data collection"
  readme = "README.md"
  license = "MIT"
  requires-python = ">=3.12"

  # List of current individual contributors to the ARC GitHub project, in
  # descending order of commits. If a contributor has left the project or
  # organisation, the associated email listed here is the one originally
  # associated with the commits. If the contributor has chosen not to make
  # email public then only the name is given.
  authors = [
    { name = "Sara Duque-Vallejo", email = "sara.duquevallejo@ndm.ox.ac.uk" },
    { name = "Philippa Liggins", email = "philippa.liggins@dtc.ox.ac.uk" },
    { name = "Sandeep R. Murthy", email = "sandeep.murthy@ndm.ox.ac.uk" },
    { name = "Esteban Garcia-Gallo", email = "esteban.garcia@ndm.ox.ac.uk" },
    { name = "Tom Edinburgh", email = "tom.edinburg@ndm.ox.ac.uk" },
    { name = "Aidan Marler", email = "" },
  ]
  maintainers = [
        { name = "Sandeep R. Murthy", email = "sandeep.murthy@ndm.ox.ac.uk" },
  ]
  dependencies = [
    "adtl>=0.13.3",
    "aenum>=3.1.17",
    "click>=8.5.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "jsonschema",
  ]

[dependency-groups]
  dev = [
    "ipdb",
    "pre-commit",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0"
  ]

  docs = [
    "Sphinx",
    "sphinx-autobuild",
    "sphinxcontrib-email",
    "sphinx-copybutton",
    "sphinx-gallery",
    "sphinx-design",
    "myst-parser",
    "pylint",
    "furo",
    "numpydoc",
    "nb2plots",
    "jupyter-sphinx",
  ]

[project.optional-dependencies]

[project.urls]
  Homepage = "https://github.com/ISARICResearch/ARC"
  Repository = "https://github.com/ISARICResearch/ARC"
  Documentation = "https://arc.docs.isaric.org"

[build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

[tool.hatch.version]
  path = "src/arc/__init__.py"

[tool.hatch.build.targets.sdist]
  packages = ["src/arc", "Lists", "units"]

[tool.hatch.build.targets.sdist.force-include]
  "ARC.csv" = "ARC.csv"
  "arc_field_types_readme.md" = "arc_field_types_readme.md"
  "crf_metadata.csv" = "crf_metadata.csv"
  "paper_like_details.csv" = "paper_like_details.csv"
  "README_ARC_Variable_Conventions.md" = "README_ARC_Variable_Conventions.md"
  "SCHEMAS-README.md" = "SCHEMAS-README.md"

[tool.hatch.build.targets.wheel]
  packages = ["src/arc", "Lists", "units"]

[tool.hatch.build.targets.wheel.force-include]
  "ARC.csv" = "ARC.csv"
  "arc_field_types_readme.md" = "arc_field_types_readme.md"
  "crf_metadata.csv" = "crf_metadata.csv"
  "paper_like_details.csv" = "paper_like_details.csv"
  "README_ARC_Variable_Conventions.md" = "README_ARC_Variable_Conventions.md"
  "SCHEMAS-README.md" = "SCHEMAS-README.md"

[tool.pytest.ini_options]
  markers = [
    "critical: critical severity test (must pass)",
    "high: high severity test",
    "medium: medium severity test",
    "low: low severity test",
  ]
